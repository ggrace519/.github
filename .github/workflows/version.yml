name: version

# Reusable changelog roll-up for repositories that keep a Keep a Changelog
# CHANGELOG.md and semantic versions. Run it on the integration branch (develop)
# after CI passes and before `promote`. It works out the next version from the
# entries under `## [Unreleased]`, moves them into a dated `## [X.Y.Z]` section
# and opens a pull request with that into the branch. Merging the pull request
# is the decision to release; the next run then has nothing to roll, and
# `promote` opens the promotion pull request with the changelog that `release`
# tags on the merge.
#
# The version is the latest release bumped by the highest level its entries ask
# for: an entry that starts with BREAKING or a `### Breaking` heading is a major
# bump, a `### Added` heading a minor one, anything else a patch. On 0.x a major bump
# is a minor one. A version section that is neither tagged nor on the base
# branch is pending: later entries fold into it and its version is worked out
# again, never downwards, so a hand-edited heading stands.
#
# The pull request comes from `chore/roll-changelog`, a branch this workflow
# owns: every run rebuilds it as the branch head plus one roll-up commit, and
# deletes it once there is nothing left to roll. The commit is made through the
# API, so GitHub signs it. Give the workflow a GitHub App (`app-client-id` and
# `app-private-key`) to open the pull request as the app, so that its checks run
# on their own; with GITHUB_TOKEN GitHub holds them until someone approves the run.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit CI passed on. Defaults to the triggering commit.
        type: string
        default: ""
      branch:
        description: Branch the roll-up pull request targets. Nothing is written unless `ref` is its head.
        type: string
        default: develop
      base:
        description: Branch releases are cut from. A version section already on it is released, not pending.
        type: string
        default: main
      changelog:
        description: Path of the changelog, relative to the repository root.
        type: string
        default: CHANGELOG.md
      tag-prefix:
        description: Prefix of release tags; the version follows it.
        type: string
        default: v
      bump:
        description: >-
          auto works the level out from the entries; patch, minor or major
          forces it.
        type: string
        default: auto
      dry-run:
        description: Report the version and the rolled section and stop; write no branch and no pull request.
        type: boolean
        default: false
      runs-on:
        description: >-
          Runner for the job: a label (ubuntu-latest) or a JSON array of labels,
          e.g. '["self-hosted","linux"]'. The runner needs git, gh and jq.
        type: string
        default: ubuntu-latest
      app-client-id:
        description: >-
          Client ID of a GitHub App installed on the repository with Contents and
          Pull requests read and write. Empty uses GITHUB_TOKEN.
        type: string
        default: ""
    secrets:
      app-private-key:
        description: Private key (the whole .pem) of the app named by `app-client-id`.
        required: false
    outputs:
      version:
        description: The changelog's top version after this run, without the prefix.
        value: ${{ jobs.roll.outputs.version }}
      sha:
        description: The commit the run looked at (`ref`); the one to promote when `pull-request` is empty.
        value: ${{ jobs.roll.outputs.sha }}
      pull-request:
        description: >-
          Number of the roll-up pull request this run opened or updated; empty when
          there was nothing to roll.
        value: ${{ jobs.roll.outputs.pull-request }}
      promote:
        description: >-
          'true' when `ref` is the head of `branch`, nothing is left to roll and the top
          version section is rolled but not yet released: the caller should run
          `promote` for `sha`. Never 'true' on a dry run.
        value: ${{ jobs.roll.outputs.promote }}

permissions:
  contents: write
  pull-requests: write

jobs:
  roll:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    outputs:
      version: ${{ steps.roll.outputs.version }}
      sha: ${{ steps.roll.outputs.sha }}
      pull-request: ${{ steps.roll.outputs.pull-request }}
      promote: ${{ steps.roll.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # No continue-on-error: an app that is configured but cannot mint a token (not
      # installed on this repository, a wrong key) fails the run instead of quietly
      # falling back to GITHUB_TOKEN.
      - name: Mint the app token
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Roll the changelog into the next version
        id: roll
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TOKEN_SOURCE: ${{ steps.app.outputs.token && format('the app {0}', steps.app.outputs.app-slug) || 'GITHUB_TOKEN' }}
          CHANGELOG: ${{ inputs.changelog }}
          PREFIX: ${{ inputs.tag-prefix }}
          TARGET_BRANCH: ${{ inputs.branch }}
          BASE_BRANCH: ${{ inputs.base }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$*" >&2; exit 1; }

          sha=$(git rev-parse HEAD)
          [ -f "$CHANGELOG" ] || fail "$CHANGELOG not found."
          case $BUMP in
            auto|patch|minor|major) ;;
            *) fail "bump must be auto, patch, minor or major, not \"$BUMP\"." ;;
          esac

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          linkdef='^\[[^]]+\]:\ '
          fence='^[[:space:]]*(```|~~~)'
          # A list item that leads with the word, bold or not: `- BREAKING: ...`. A mention
          # further into an entry does not count.
          breaking='^[[:space:]]*[-*+][[:space:]]+(\*\*|__)?BREAKING'

          # True when semantic version $1 is newer than $2. Cores compare numerically;
          # on an equal core a release outranks a pre-release.
          semver_gt() {
            local a=$1 b=$2
            if [ "${a%%-*}" != "${b%%-*}" ]; then
              [ "$(printf '%s\n%s\n' "${a%%-*}" "${b%%-*}" | sort -V | tail -n 1)" = "${a%%-*}" ]
              return
            fi
            case "$a/$b" in
              *-*/*-*) [ "$a" != "$b" ] && [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -n 1)" = "$a" ] ;;
              *-*/*) return 1 ;;
              */*-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Drop the blank lines around stdin.
          trim_blank() {
            awk 'NF { seen = 1 } seen { buf[++n] = $0; if (NF) last = n } END { for (i = 1; i <= last; i++) print buf[i] }'
          }

          # finish <version> [<pull request>] [promote]
          finish() {
            {
              echo "version=$1"
              echo "sha=$sha"
              echo "pull-request=${2:-}"
              echo "promote=${3:-false}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          repo=$GITHUB_REPOSITORY
          roll_branch=chore/roll-changelog
          staging=$roll_branch-staging

          branch_head() {
            gh api "repos/$repo/git/ref/heads/$TARGET_BRANCH" --jq .object.sha
          }
          # $TARGET_BRANCH no longer ends at this commit. When it moved on, the run for its
          # new head does the work; a commit that was never on it is a wrong `ref`.
          not_head() {
            git fetch --quiet --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            if ! git merge-base --is-ancestor "$sha" "origin/$TARGET_BRANCH"; then
              fail "${sha:0:7} is not on $TARGET_BRANCH. Run this workflow for a commit of $TARGET_BRANCH; a manual run must be started from that branch."
            fi
            echo "::notice::$TARGET_BRANCH moved on from ${sha:0:7}; the run for its new head rolls the changelog."
            finish "$current"
          }
          # Nothing is written for a commit that is not the branch head.
          require_head() {
            local head
            head=$(branch_head) || fail "Could not read the head of $TARGET_BRANCH."
            [ "$head" = "$sha" ] || not_head
          }
          # A missing branch is a 404; any other failure is not taken for one.
          ref_exists() {
            local err
            err=$(gh api "repos/$repo/git/ref/heads/$1" 2>&1 > /dev/null) && return 0
            [[ $err == *"HTTP 404"* ]] && return 1
            fail "Could not read the branch $1: $err"
          }
          # Point branch $1 at commit $2, creating it when needed.
          point() {
            if ref_exists "$1"; then
              gh api --method PATCH "repos/$repo/git/refs/heads/$1" -f sha="$2" -F force=true > /dev/null
            else
              gh api --method POST "repos/$repo/git/refs" -f ref="refs/heads/$1" -f sha="$2" > /dev/null
            fi
          }
          find_pr() {
            gh api "repos/$repo/pulls?state=open&base=$TARGET_BRANCH&head=${repo%%/*}:$roll_branch" --jq '.[0].number // empty'
          }
          # Nothing left to roll: close the roll-up pull request and delete its branch, which
          # is still there after a merge unless the repository deletes merged branches, and
          # a staging branch that a cancelled run left behind. retire <version> [promote]:
          # `ref` may be promoted only when it carries a rolled, unreleased version.
          retire() {
            local pr b
            [ "$DRY_RUN" != true ] || finish "$1"
            require_head
            pr=$(find_pr) || fail "Could not look up the roll-up pull request."
            if [ -n "$pr" ]; then
              gh api --method POST "repos/$repo/issues/$pr/comments" \
                -f body="$TARGET_BRANCH has nothing left to roll, so this roll-up pull request is closed." > /dev/null
              gh api --method PATCH "repos/$repo/pulls/$pr" -f state=closed > /dev/null
              echo "Closed the roll-up pull request #$pr."
            fi
            for b in "$roll_branch" "$staging"; do
              if ref_exists "$b"; then
                gh api --method DELETE "repos/$repo/git/refs/heads/$b" > /dev/null
                echo "Deleted $b."
              fi
            done
            finish "$1" "" "${2:-false}"
          }

          git fetch --quiet --force origin 'refs/tags/*:refs/tags/*'
          git fetch --quiet --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" 2>/dev/null || true

          # Split the changelog: the preamble, the [Unreleased] body, the top version
          # section, and everything below it, which is kept as it is.
          preamble=()
          unreleased=()
          top=()
          rest=()
          unreleased_heading=""
          top_heading=""
          top_version=""
          state=preamble
          fenced=false
          crlf=false
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ $line == *$'\r' ]]; then
              crlf=true
              line=${line%$'\r'}
            fi
            # Headings inside a fenced code block are text.
            if [[ $line =~ $fence ]]; then
              if [ "$fenced" = true ]; then fenced=false; else fenced=true; fi
            elif [ "$fenced" = false ] && [ "$state" != rest ] && [[ $line =~ ^##\  && ! $line =~ ^##\ \[[^]]+\] ]]; then
              if [ "$state" != preamble ]; then
                fail "\"$line\" in $CHANGELOG is not a \`## [X.Y.Z] - YYYY-MM-DD\` heading; the sections cannot be told apart."
              fi
            elif [ "$fenced" = false ] && [ "$state" != rest ] && [[ $line =~ ^##\ \[([^]]+)\] ]]; then
              name=${BASH_REMATCH[1]}
              if [ "$state" = preamble ] && [ "${name,,}" = unreleased ]; then
                state=unreleased
                unreleased_heading=$line
                continue
              fi
              if [ "$state" != top ]; then
                state=top
                top_heading=$line
                top_version=$name
                continue
              fi
              state=rest
            fi
            case $state in
              preamble) preamble+=("$line") ;;
              unreleased) unreleased+=("$line") ;;
              top) top+=("$line") ;;
              rest) rest+=("$line") ;;
            esac
          done < "$CHANGELOG"

          # The top version section is pending while it is neither tagged nor on the
          # base branch: it was rolled by an earlier run and has not been released.
          pending=false
          if [ -n "$top_version" ] \
            && ! git rev-parse -q --verify "refs/tags/$PREFIX$top_version" > /dev/null; then
            pending=true
            on_base=$(git show "origin/$BASE_BRANCH:$CHANGELOG" 2>/dev/null || true)
            if grep -qF -- "## [$top_version]" <<< "$on_base"; then
              pending=false
            fi
          fi
          if [ "$pending" = true ] && ! [[ $top_version =~ $semver ]]; then
            fail "Top section \"$top_version\" in $CHANGELOG is not a semantic version (X.Y.Z)."
          fi

          # Entries are gathered per `### Category`, in order of first appearance. Lines
          # ahead of the first category are kept under the key ":loose". Link reference
          # definitions move to the end of the file.
          categories=()
          declare -A title=() body=()
          links=()
          absorbed=0
          add_chunk() {
            local key=$1 text
            text=$(printf '%s' "$2" | trim_blank)
            [ -n "$text" ] || return 0
            if [ -n "${body[$key]:-}" ]; then
              body[$key]+=$'\n'"$text"
            else
              body[$key]=$text
            fi
            absorbed=$((absorbed + 1))
          }
          absorb() {
            local key=":loose" chunk="" entry heading inside=false
            for entry in "$@"; do
              if [[ $entry =~ $fence ]]; then
                if [ "$inside" = true ]; then inside=false; else inside=true; fi
                chunk+=$entry$'\n'
              elif [ "$inside" = true ]; then
                chunk+=$entry$'\n'
              elif [[ $entry =~ $linkdef ]]; then
                links+=("$entry")
              elif [[ $entry =~ ^###\ +(.*[^[:space:]])[[:space:]]*$ ]]; then
                add_chunk "$key" "$chunk"
                chunk=""
                heading=${BASH_REMATCH[1]}
                key=${heading,,}
                if [ -z "${title[$key]:-}" ]; then
                  title[$key]=$heading
                  categories+=("$key")
                fi
              else
                chunk+=$entry$'\n'
              fi
            done
            add_chunk "$key" "$chunk"
          }

          if [ "$pending" = true ]; then
            absorb ${top[@]+"${top[@]}"}
          fi
          before=$absorbed
          absorb ${unreleased[@]+"${unreleased[@]}"}
          has_unreleased=false
          [ "$absorbed" -gt "$before" ] && has_unreleased=true

          current=""
          [[ $top_version =~ $semver ]] && current=$top_version
          if [ "$absorbed" -eq 0 ] || { [ "$pending" = false ] && [ "$has_unreleased" = false ]; }; then
            echo "[Unreleased] has no entries; nothing to roll."
            # No rolled, unreleased version: a promotion would fail `release`, so none is made.
            echo "::notice::$TARGET_BRANCH has no changelog entries${current:+ after $PREFIX$current}, so there is nothing to promote. Add an entry under [Unreleased] to release its changes."
            retire "$current"
          fi

          level="patch"
          [ -n "${body[added]:-}" ] && level=minor
          for key in ":loose" ${categories[@]+"${categories[@]}"}; do
            [ -n "${body[$key]:-}" ] || continue
            if [[ $key == breaking* ]] || grep -Eq -- "$breaking" <<< "${body[$key]}"; then
              level=major
            fi
          done
          [ "$BUMP" = auto ] || level=$BUMP

          # Bump from the newest release: the highest stable tag, or the changelog's
          # newest released section when that is ahead of the tags.
          from=0.0.0
          while IFS= read -r t; do
            v=${t#"$PREFIX"}
            [[ $v =~ $semver && $v != *-* ]] || continue
            if semver_gt "$v" "$from"; then from=$v; fi
          done < <(git tag --list "${PREFIX}*")
          released=$top_version
          if [ "$pending" = true ]; then
            released=""
            if [ "${#rest[@]}" -gt 0 ] && [[ ${rest[0]} =~ ^##\ \[([^]]+)\] ]]; then
              released=${BASH_REMATCH[1]}
            fi
          fi
          if [[ $released =~ $semver && $released != *-* ]] && semver_gt "$released" "$from"; then
            from=$released
          fi

          IFS=. read -r major minor patch <<< "$from"
          if [ "$level" = major ] && [ "$major" -eq 0 ]; then level=minor; fi
          case $level in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          # A tagged pre-release of a later version is a floor: 2.0.0-rc.1 is followed by
          # 2.0.0, not by 1.4.1.
          while IFS= read -r t; do
            v=${t#"$PREFIX"}
            [[ $v =~ $semver && $v == *-* ]] || continue
            if semver_gt "${v%%-*}" "$next"; then next=${v%%-*}; fi
          done < <(git tag --list "${PREFIX}*")

          version=$next
          if [ "$pending" = true ]; then
            # A pre-release heading was written by hand and is kept; otherwise the pending
            # version only ever moves up.
            if [[ $top_version == *-* ]] || semver_gt "$top_version" "$next"; then
              version=$top_version
            fi
            if [ "$has_unreleased" = false ] && [ "$version" = "$top_version" ]; then
              echo "$top_version is already rolled and [Unreleased] has no entries; nothing to roll."
              retire "$top_version" true
            fi
          fi

          section=$(mktemp)
          {
            if [ -n "${body[:loose]:-}" ]; then
              printf '%s\n\n' "${body[:loose]}"
            fi
            for key in ${categories[@]+"${categories[@]}"}; do
              [ -n "${body[$key]:-}" ] || continue
              printf '### %s\n%s\n\n' "${title[$key]}" "${body[$key]}"
            done
          } | trim_blank > "$section"

          rolled=$(mktemp)
          {
            [ "${#preamble[@]}" -eq 0 ] || printf '%s\n' "${preamble[@]}"
            if [ -n "$unreleased_heading" ]; then
              printf '%s\n\n' "$unreleased_heading"
            fi
            printf '## [%s] - %s\n\n' "$version" "$(date -u +%F)"
            cat "$section"
            echo
            if [ "$pending" = false ] && [ -n "$top_heading" ]; then
              printf '%s\n' "$top_heading" ${top[@]+"${top[@]}"}
            fi
            last=""
            if [ "${#rest[@]}" -gt 0 ]; then
              printf '%s\n' "${rest[@]}"
              last=${rest[-1]}
            elif [ "$pending" = false ] && [ "${#top[@]}" -gt 0 ]; then
              last=${top[-1]}
            fi
            if [ "${#links[@]}" -gt 0 ]; then
              [ -z "${last//[[:space:]]/}" ] || echo
              printf '%s\n' "${links[@]}"
            fi
          } | trim_blank > "$rolled"
          # A changelog with CRLF line endings keeps them.
          if [ "$crlf" = true ]; then sed -i 's/$/\r/' "$rolled"; fi

          {
            echo "## Next release: $PREFIX$version"
            echo
            echo "A $level bump from $PREFIX$from."
            echo
            cat "$section"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: $CHANGELOG would be rolled into $version (a $level bump from $from)."
            finish "$version"
          fi

          require_head
          encoded=$(mktemp)
          base64 < "$rolled" | tr -d '\n' > "$encoded"
          pr_title="chore(release): roll changelog into $version"
          # The commit is built on a scratch branch and the roll-up branch is then moved onto
          # it: a pull request whose branch points at the base commit, even for a moment, is
          # closed by GitHub. createCommitOnBranch, not git push, so that GitHub signs it.
          # shellcheck disable=SC2016
          query='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
          point "$staging" "$sha"
          out=$(mktemp)
          err=$(mktemp)
          if ! jq -n \
            --arg query "$query" \
            --arg repo "$repo" \
            --arg branch "$staging" \
            --arg oid "$sha" \
            --arg headline "$pr_title" \
            --arg path "$CHANGELOG" \
            --rawfile contents "$encoded" \
            '{query: $query, variables: {input: {
               branch: {repositoryNameWithOwner: $repo, branchName: $branch},
               expectedHeadOid: $oid,
               message: {headline: $headline},
               fileChanges: {additions: [{path: $path, contents: $contents}]}}}}' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid > "$out" 2> "$err"; then
            cat "$out" "$err" >&2
            gh api --method DELETE "repos/$repo/git/refs/heads/$staging" > /dev/null 2>&1 || true
            fail "Committing the roll-up to $staging was refused. A branch ruleset that covers chore/ branches applies to this workflow's token too."
          fi
          commit=$(cat "$out")
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || fail "Unexpected answer to the roll-up commit: $commit"
          # The staging branch was just set to $sha, so expectedHeadOid cannot tell whether
          # $TARGET_BRANCH moved meanwhile. Check again before the pull request changes.
          head=$(branch_head) || fail "Could not read the head of $TARGET_BRANCH."
          if [ "$head" != "$sha" ]; then
            gh api --method DELETE "repos/$repo/git/refs/heads/$staging" > /dev/null
            not_head
          fi
          point "$roll_branch" "$commit"
          gh api --method DELETE "repos/$repo/git/refs/heads/$staging" > /dev/null

          pr_body=$(mktemp)
          {
            echo "Rolls the \`[Unreleased]\` entries of \`$CHANGELOG\` into **$PREFIX$version**, a $level bump from $PREFIX$from."
            echo
            echo "Merging this pull request is the decision to release $PREFIX$version: the next run opens or refreshes the promotion pull request, and merging that one tags the release. Use a merge commit."
            echo
            echo "## $PREFIX$version"
            echo
            cat "$section"
            echo
            echo "Maintained by the shared \`version\` workflow. Every run on \`$TARGET_BRANCH\` rebuilds \`$roll_branch\` as its head plus this one commit, so do not push to it and put notes in a comment."
          } > "$pr_body"

          # REST, not gh pr edit: that command queries Projects (classic) and fails once
          # GitHub returns the deprecation error.
          update_pr() {
            jq -n --arg title "$pr_title" --rawfile body "$pr_body" '{title: $title, body: $body}' \
              | gh api --method PATCH "repos/$repo/pulls/$1" --input - > /dev/null
            echo "Updated the roll-up pull request #$1."
          }
          pr=$(find_pr) || fail "Could not look up the roll-up pull request."
          if [ -n "$pr" ]; then
            update_pr "$pr"
          elif pr=$(jq -n --arg title "$pr_title" --rawfile body "$pr_body" --arg head "$roll_branch" --arg base "$TARGET_BRANCH" \
              '{title: $title, body: $body, head: $head, base: $base}' \
              | gh api --method POST "repos/$repo/pulls" --input - --jq .number 2> "$err"); then
            echo "Opened the roll-up pull request #$pr."
          else
            # Another run may have opened it in the meantime.
            pr=$(find_pr) || true
            if [ -z "$pr" ]; then
              cat "$err" >&2
              fail "Opening the roll-up pull request failed. Workflows may open pull requests only when the repository allows it (Settings → Actions → General)."
            fi
            update_pr "$pr"
          fi

          echo "Rolled $CHANGELOG into $version at ${commit:0:7} on $roll_branch, pull request #$pr."
          {
            echo
            echo "Committed as \`${commit:0:7}\` on \`$roll_branch\`; roll-up pull request #$pr, opened with $TOKEN_SOURCE."
          } >> "$GITHUB_STEP_SUMMARY"
          finish "$version" "$pr"
