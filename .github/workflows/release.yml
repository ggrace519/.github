name: release

# Reusable tag-and-release for repositories that keep a Keep a Changelog
# CHANGELOG.md and semantic versions. Run it on every push to the release
# branch (main). It reads the top `## [X.Y.Z] - YYYY-MM-DD` section of the
# changelog; when that version has no tag yet it creates the tag `vX.Y.Z` on
# the pushed commit and a GitHub release whose notes are that section. A push
# whose top version is already tagged on another commit fails: the release
# branch moved without a new changelog version. `dry-run` only validates, so
# the same workflow can gate the promotion pull request.
#
# Tags and releases made with GITHUB_TOKEN start no other workflows. A repo
# whose build runs `on: push: tags` must either chain that build after this
# job (`needs:` plus the `tag` output) or pass a `token` secret.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to release. Defaults to the triggering commit.
        type: string
        default: ""
      changelog:
        description: Path of the changelog, relative to the repository root.
        type: string
        default: CHANGELOG.md
      tag-prefix:
        description: Prefix of release tags; the version follows it.
        type: string
        default: v
      major-tag:
        description: >-
          Also move the major tag (v1 for 1.x.y) to this release. Skipped for
          pre-releases. A tag ruleset that blocks updates refuses this for
          GITHUB_TOKEN; exclude the major tag from the ruleset or pass a
          `token` secret that may bypass it.
        type: boolean
        default: false
      dry-run:
        description: Validate the changelog against the existing tags and stop; create nothing.
        type: boolean
        default: false
      runs-on:
        description: >-
          Runner for the job: a label (ubuntu-latest) or a JSON array of labels,
          e.g. '["self-hosted","linux"]'. The runner needs git, gh and jq.
        type: string
        default: ubuntu-latest
    secrets:
      token:
        description: >-
          Token used instead of GITHUB_TOKEN to create the tag and release, so
          that tag-triggered workflows start, or to bypass a tag ruleset.
        required: false
    outputs:
      version:
        description: The version named by the changelog, without the prefix.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The release tag, prefix included.
        value: ${{ jobs.release.outputs.tag }}
      released:
        description: "'true' when this run created the tag and release."
        value: ${{ jobs.release.outputs.released }}
      url:
        description: URL of the release, when it exists.
        value: ${{ jobs.release.outputs.url }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Tag and release the changelog's top version
        id: release
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          CHANGELOG: ${{ inputs.changelog }}
          PREFIX: ${{ inputs.tag-prefix }}
          MAJOR_TAG: ${{ inputs.major-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$*" >&2; exit 1; }

          sha=$(git rev-parse HEAD)
          [ -f "$CHANGELOG" ] || fail "$CHANGELOG not found."

          # Split the changelog into its `## [...]` sections. The first section that is not
          # [Unreleased] names the release; its body becomes the release notes. Link
          # reference definitions (`[1.2.3]: https://...`) are dropped from the notes.
          section=""
          version=""
          heading_rest=""
          unreleased_has_entries=false
          notes=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ $line =~ ^##\ \[([^]]+)\](.*)$ ]]; then
              name=${BASH_REMATCH[1]}
              if [ "${name,,}" = unreleased ]; then
                section=unreleased
              elif [ -z "$version" ]; then
                version=$name
                heading_rest=${BASH_REMATCH[2]}
                section=release
              else
                section=older
              fi
              continue
            fi
            [[ $line =~ ^\[[^]]+\]:\  ]] && continue
            case $section in
              unreleased)
                if [[ -n ${line//[[:space:]]/} && ! $line =~ ^###\  ]]; then
                  unreleased_has_entries=true
                fi
                ;;
              release)
                printf '%s\n' "$line" >> "$notes"
                ;;
            esac
          done < "$CHANGELOG"
          # Trim blank lines around the notes.
          sed -i -e '/./,$!d' "$notes"
          printf '%s\n' "$(cat "$notes")" > "$notes"

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [ -n "$version" ] || fail "$CHANGELOG has no \`## [X.Y.Z] - YYYY-MM-DD\` release section."
          [[ $version =~ $semver ]] || fail "Top release \"$version\" in $CHANGELOG is not a semantic version (X.Y.Z)."
          [[ $heading_rest =~ [0-9]{4}-[0-9]{2}-[0-9]{2} ]] || fail "Release $version needs a date: \`## [$version] - YYYY-MM-DD\`."
          [ -n "$(tr -d '[:space:]' < "$notes")" ] || fail "Release $version has no entries in $CHANGELOG."
          if [ "$unreleased_has_entries" = true ]; then
            fail "[Unreleased] still has entries. Roll them into \`## [X.Y.Z] - YYYY-MM-DD\` before releasing."
          fi

          tag="$PREFIX$version"
          prerelease=false
          [[ $version == *-* ]] && prerelease=true

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # True when semantic version $1 is newer than $2. Cores compare numerically;
          # on an equal core a release outranks a pre-release.
          semver_gt() {
            local a=$1 b=$2
            if [ "${a%%-*}" != "${b%%-*}" ]; then
              [ "$(printf '%s\n%s\n' "${a%%-*}" "${b%%-*}" | sort -V | tail -n 1)" = "${a%%-*}" ]
              return
            fi
            case "$a/$b" in
              *-*/*-*) [ "$a" != "$b" ] && [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -n 1)" = "$a" ] ;;
              *-*/*) return 1 ;;
              */*-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          git fetch --quiet --force origin 'refs/tags/*:refs/tags/*'

          # Move (or create) the major tag so that it names this release. Idempotent, so
          # a re-run after a refused move repairs it.
          major_ref=""
          if [ "$MAJOR_TAG" = true ] && [ "$prerelease" = false ]; then
            major_ref="$PREFIX${version%%.*}"
          fi
          point_major_tag() {
            [ -n "$major_ref" ] || return 0
            local current out
            current=$(git rev-parse -q --verify "refs/tags/$major_ref^{commit}" || true)
            if [ "$current" = "$sha" ]; then
              echo "$major_ref already names ${sha:0:7}."
              return 0
            fi
            if [ -z "$current" ]; then
              out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$major_ref" -f sha="$sha" 2>&1) \
                || { echo "$out" >&2; fail "Creating $major_ref was refused. A tag ruleset that blocks creation applies to GITHUB_TOKEN too: exclude the major tag from the ruleset, or pass a \`token\` that may bypass it."; }
              echo "Created $major_ref at ${sha:0:7}."
            else
              out=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major_ref" \
                -f sha="$sha" -F force=true 2>&1) \
                || { echo "$out" >&2; fail "Moving $major_ref was refused. A tag ruleset that blocks updates applies to GITHUB_TOKEN too: exclude the major tag from the ruleset, or pass a \`token\` that may bypass it."; }
              echo "Moved $major_ref from ${current:0:7} to ${sha:0:7}."
            fi
          }

          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$existing" ]; then
            if [ "$existing" != "$sha" ]; then
              fail "$tag already tags ${existing:0:7}, but this commit is ${sha:0:7}. Add a new \`## [X.Y.Z] - YYYY-MM-DD\` section to $CHANGELOG before pushing to the release branch."
            fi
            echo "released=false" >> "$GITHUB_OUTPUT"
            url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null || true)
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "$tag already names ${sha:0:7}; nothing to release."
            [ "$DRY_RUN" = true ] || point_major_tag
            exit 0
          fi

          latest=""
          while IFS= read -r t; do
            v=${t#"$PREFIX"}
            [[ $v =~ $semver ]] || continue
            if [ -z "$latest" ] || semver_gt "$v" "$latest"; then latest=$v; fi
          done < <(git tag --list "${PREFIX}*")
          if [ -n "$latest" ] && ! semver_gt "$version" "$latest"; then
            fail "Release $version is not newer than the latest tag $PREFIX$latest."
          fi
          previous=${latest:+$PREFIX$latest}
          previous=${previous:-none}

          {
            echo "## $tag"
            echo
            echo "Commit \`${sha:0:7}\`; previous release: $previous."
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = true ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "Dry run: $tag would be created at ${sha:0:7} (previous: $previous)."
            exit 0
          fi

          args=(--repo "$GITHUB_REPOSITORY" --target "$sha" --title "$tag" --notes-file "$notes")
          [ "$prerelease" = true ] && args+=(--prerelease)
          # gh creates the tag at --target when it does not exist yet.
          url=$(gh release create "$tag" "${args[@]}")
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Released $tag at ${sha:0:7}: $url"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Released: $url" >> "$GITHUB_STEP_SUMMARY"

          point_major_tag
